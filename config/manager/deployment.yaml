apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-admission-controller
  namespace: gpu-admission-system
  labels:
    app.kubernetes.io/name: gpu-admission-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-admission-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-admission-controller
    spec:
      serviceAccountName: gpu-admission-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: gpu-admission-controller:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --admission-check-name=gpu-admission
            - --health-probe-bind-address=:8081
            # Metrics are localhost-only; not exposed via Service.
            - --metrics-bind-address=127.0.0.1:8080
          ports:
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuadmissionpolicies.gpu-admission.justrunme.com
spec:
  group: gpu-admission.justrunme.com
  names:
    kind: GPUAdmissionPolicy
    listKind: GPUAdmissionPolicyList
    plural: gpuadmissionpolicies
    singular: gpuadmissionpolicy
    shortNames:
      - gap
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  minLength: 1
                requiredLabels:
                  type: array
                  items:
                    type: string
                allowedFlavors:
                  type: array
                  items:
                    type: string
                allowedGPUModels:
                  type: array
                  items:
                    type: string
                allowedImageRegistries:
                  type: array
                  items:
                    type: string
                namespaceGPUQuota:
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                teamGPUQuota:
                  type: object
                  additionalProperties:
                    type: integer
                    format: int64
                teamLabelKey:
                  type: string
                maxGPUHoursPerWorkload:
                  type: number
                maxBudgetUSDMicros:
                  type: integer
                  format: int64
                gpuHourPriceMicros:
                  type: integer
                  format: int64
                holdOnQuotaExhausted:
                  type: boolean
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64

apiVersion: batch/v1
kind: Job
metadata:
  name: ghcr-evil
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: gpu-lq
    cost-center: cc-100
    owner: alice
    team: alpha
  annotations:
    gpu-admission.justrunme.com/estimated-hours: "1"
spec:
  suspend: true
  template:
    metadata:
      labels:
        cost-center: cc-100
        owner: alice
        team: alpha
      annotations:
        gpu-admission.justrunme.com/estimated-hours: "1"
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu-admission.justrunme.com/gpu-flavor: a100-sim
      containers:
        - name: train
          # Must be rejected: allowlist has ghcr.io/acme/, not ghcr.io/evil/.
          image: ghcr.io/evil/exfil:latest
          command: ["sh", "-c", "echo should-not-run"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
